services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////data/sqlite.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me-min-32-chars}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - DEBUG=${DEBUG:-false}
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./data:/data
    networks: [internal]
    # NOTE: no "ports:" — API is reachable only via the `web` service on the
    # internal network. To smoke-test the API alone, run:
    #   docker compose run --rm --service-ports api

  web:
    build: ./web
    restart: unless-stopped
    environment:
      - API_URL=http://api:8000
      - NODE_ENV=production
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

networks:
  internal:
    driver: bridge
