services:
  api:
    image: ghcr.io/nathan71370/limperiam-portfolio-api:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////data/sqlite.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEBUG=false
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./data:/data
    networks: [internal]

  web:
    image: ghcr.io/nathan71370/limperiam-portfolio-web:latest
    restart: unless-stopped
    environment:
      - API_URL=http://api:8000
      - NODE_ENV=production
      - NEXT_PUBLIC_CALCOM_LINK=${NEXT_PUBLIC_CALCOM_LINK:-}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [internal, traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.limperiam.rule=Host(`limperiam.com`)"
      - "traefik.http.routers.limperiam.entrypoints=websecure"
      - "traefik.http.routers.limperiam.tls.certresolver=cloudflare"
      - "traefik.http.services.limperiam.loadbalancer.server.port=3000"

networks:
  internal:
    driver: bridge
  traefik:
    external: true
    name: traefik
